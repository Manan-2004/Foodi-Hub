<section class="profile-page">

  <div class="top-banner">

    <div class="banner-content">

      <h1>My Profile</h1>

      <p>
        Manage your account settings & food activity
      </p>

    </div>

  </div>

  <div class="profile-container">

    <!-- profile -->

    <section class="section">

      <div class="heading">
        <div class="line"></div>
        <h2>Profile Information</h2>
      </div>

      <app-profile-header></app-profile-header>

    </section>


    <!-- stats -->

    <section class="section">

      <div class="heading">
        <div class="line"></div>
        <h2>Overview</h2>
      </div>

      <app-profile-stats></app-profile-stats>

    </section>


    <!-- grid -->

    <section class="main-grid">

      <section class="section">

        <div class="heading">
          <div class="line"></div>
          <h2>Recent Orders</h2>
        </div>

        <app-recent-orders></app-recent-orders>

      </section>



      <!-- right -->

      <div class="right-side">

        <section class="section">

          <div class="heading">
            <div class="line"></div>
            <h2>Saved Address</h2>
          </div>

          <app-saved-address></app-saved-address>

        </section>


        <section class="section">

          <div class="heading">
            <div class="line"></div>
            <h2>Account Settings</h2>
          </div>

          <app-profile-details></app-profile-details>

        </section>

      </div>

    </section>

  </div>

</section>
