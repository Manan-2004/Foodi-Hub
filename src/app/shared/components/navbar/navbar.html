<nav class="navbar">

    <div class="logo">
        🍔 FoodieHub
    </div>

    <!-- Mobile button -->

    <div class="menu-btn" (click)="toggleMenu()">

        {{isMenuOpen ? '✖' : '☰'}}

    </div>

    <!-- Links -->

    <div class="nav-links" [class.open]="isMenuOpen">

        <a routerLink="customer/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">

            Home

        </a>

        <a routerLink="customer/menu" routerLinkActive="active" (click)="closeMenu()">

            Menu

        </a>

        <a routerLink="customer/cart" routerLinkActive="active" (click)="closeMenu()" class="cart-link">
            🛒 Cart
            @if(cartService.totalItems()>0){
            <span class="cart-count">
                {{cartService.totalItems()}}
            </span>
            }
        </a>

        <a routerLink="customer/profile" routerLinkActive="active" (click)="closeMenu()">

            👤 Profile

        </a>

        <a routerLink="auth/login" class="login-btn" routerLinkActive="active" (click)="closeMenu()">

            Login

        </a>

    </div>

</nav>
