<section class="success-page">

    <!-- floating bubbles -->
    <div class="floating floating1"></div>
    <div class="floating floating2"></div>
    <div class="floating floating3"></div>

    <div class="success-container">

        <!-- success animation -->
        <div class="success-animation">

            <div class="ring"></div>
            <div class="ring ring2"></div>
            <div class="ring ring3"></div>

            <div class="success-icon">

                <svg viewBox="0 0 120 120">

                    <path class="check-path"
                        d="M30 65 L50 85 L90 40" />

                </svg>

            </div>

        </div>

        <!-- text -->
        <div class="success-content">

            <span class="status">
                ORDER CONFIRMED
            </span>

            <h1>
                Order Placed Successfully 🎉
            </h1>

            <p>
                Your food is being prepared and our delivery
                partner is getting ready 🚚
            </p>

            <!-- order id -->
            <div class="order-id">

                <small>
                    ORDER ID
                </small>

                <h2>
                    #FD{{orderId}}
                </h2>

            </div>

        </div>

        <!-- buttons -->
        <div class="btn-group">

            <button routerLink="/customer/menu" class="primary-btn">
                Continue Shopping
            </button>

            <button routerLink="/orders" class="secondary-btn">
                Track Order
            </button>

        </div>

    </div>

</section>
