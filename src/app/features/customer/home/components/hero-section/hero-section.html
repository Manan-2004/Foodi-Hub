<section class="hero">

    <div class="hero-left">

        <span class="tag">
            {{heroData.tag}}
        </span>

        <h1>
            {{heroData.title}}
        </h1>

        <p>
            {{heroData.description}}
        </p>

        <div class="hero-btns">

            <button class="order-btn">
                Order Now
            </button>

            <button class="menu-btn">
                View Menu
            </button>

        </div>

        <div class="hero-stats">

            <div class="stat">

                <h3>10K+</h3>

                <span>Happy Customers</span>

            </div>

            <div class="stat">

                <h3>500+</h3>

                <span>Restaurants</span>

            </div>

            <div class="stat">

                <h3>30min</h3>

                <span>Delivery</span>

            </div>

        </div>

    </div>

    <div class="hero-right">

        <div class="circle-bg"></div>

        <div class="food-image">

            {{heroData.foodImage}}

        </div>

    </div>

</section>
