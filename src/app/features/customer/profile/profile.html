<section class="profile-page">

  <div class="top-banner">

    <div class="banner-content">

      <h1>My Profile</h1>

      <p>
        Manage your account, orders and saved addresses
      </p>

    </div>

  </div>

  <div class="profile-container">

    <!-- profile -->

    <section class="section">

      <div class="heading">

        <div class="line"></div>

        <h2>Profile Information</h2>

      </div>

      <app-profile-header>
      </app-profile-header>

    </section>

    <!-- overview -->

    <section class="section">

      <div class="heading">

        <div class="line"></div>

        <h2>Overview</h2>

      </div>

      <app-profile-stats>
      </app-profile-stats>

    </section>

    <!-- actions + address -->

    <section class="grid-layout">

      <div class="section">

        <div class="heading">

          <div class="line"></div>

          <h2>Quick Actions</h2>

        </div>

        <app-profile-actions>
        </app-profile-actions>

      </div>

      <div class="section">

        <div class="heading">

          <div class="line"></div>

          <h2>Saved Address</h2>

        </div>

        <app-saved-address>
        </app-saved-address>

      </div>

    </section>

    <!-- settings -->

    <section class="section">

      <div class="heading">

        <div class="line"></div>

        <h2>Account Settings</h2>

      </div>

      <app-profile-details>
      </app-profile-details>

    </section>

  </div>

</section>
