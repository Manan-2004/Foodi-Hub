<nav class="navbar">

    <div class="logo">
        <span>🍔</span>
        <h2>FoodieHub</h2>
    </div>
    <!-- Mobile button -->

    <div class="menu-btn" (click)="toggleMenu()">

        {{isMenuOpen ? '✖':'☰'}}

    </div>

    <!-- Nav links -->

    <div class="nav-links" [class.open]="isMenuOpen">

        <a routerLink="/customer/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"
            (click)="closeMenu()">

            Home

        </a>


        <a routerLink="/customer/menu" routerLinkActive="active" (click)="closeMenu()">

            Menu

        </a>

        <!-- Login not done -->

        @if(!authService.isLoggedIn()){

        <a routerLink="/auth/login" class="login-btn" (click)="closeMenu()">

            Login

        </a>

        }

        <!-- Login done -->

        @else{
        <a routerLink="/customer/cart" routerLinkActive="active" class="cart-link" (click)="closeMenu()">

            🛒 Cart

            @if(cartService.totalItems()>0){

            <span class="cart-count">

                {{cartService.totalItems()}}

            </span>

            }

        </a>

        <a routerLink="/customer/profile" routerLinkActive="active" (click)="closeMenu()">

            👤 Profile

        </a>

        <button class="logout-btn" (click)="logout()">

            Logout

        </button>

        }

    </div>

</nav>
